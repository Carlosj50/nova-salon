<div class="panel-brand" aria-label="Marca del negocio">
  {% if business.logo_path %}
    <img src="{{ business.logo_path }}" alt="Logo de {{ business.name }}" class="panel-brand-logo">
  {% else %}
    <span class="panel-brand-logo-fallback" aria-hidden="true">{{ (business.name or "N")[:1] }}</span>
  {% endif %}
  <div class="panel-brand-copy">
    <span class="panel-brand-kicker">Panel</span>
    <strong class="panel-brand-name">{{ business.name }}</strong>
  </div>
</div>
