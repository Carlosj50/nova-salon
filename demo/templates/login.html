<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | {{ business.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <main class="page-shell auth-shell">
      <section class="form-panel auth-card" aria-label="Acceso al panel">
        <header class="page-header auth-header">
          <div>
            <p class="eyebrow">Acceso interno</p>
            <h1>Entrar al panel</h1>
            <p class="subtitle">Protección simple para agenda, clientes, citas y configuración.</p>
          </div>
          {% include "_nav.html" %}
        </header>

        {% if logged_out %}
          <div class="notice">Sesión cerrada correctamente.</div>
        {% endif %}
        {% if error %}
          <div class="notice notice-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="auth-form">
          <input type="hidden" name="next" value="{{ next_path }}">

          <label>
            Usuario
            <input
              type="text"
              name="username"
              autocomplete="username"
              placeholder="Usuario admin"
              required
            >
          </label>

          <label>
            Contraseña
            <div class="password-field">
              <input
                id="login-password"
                type="password"
                name="password"
                autocomplete="current-password"
                placeholder="Tu contraseña"
                required
              >
              <button
                type="button"
                class="password-toggle"
                aria-label="Mostrar contraseña"
                aria-pressed="false"
                title="Mostrar contraseña"
                data-password-toggle
              >
                <span class="sr-only">Mostrar contraseña</span>
                <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                  <circle cx="12" cy="12" r="3.2"></circle>
                </svg>
                <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 4.5 20 21"></path>
                  <path d="M9.8 6.3A10.7 10.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17.2 17.2 0 0 1-3.4 4.1"></path>
                  <path d="M6.2 8A17 17 0 0 0 2.5 12s3.5 6 9.5 6c.8 0 1.6-.1 2.4-.3"></path>
                  <path d="M14.7 14.9A3.2 3.2 0 0 1 9.1 9.3"></path>
                </svg>
              </button>
            </div>
          </label>

          <div class="form-actions">
            <button type="submit" class="primary-button">Entrar</button>
            <a href="/" class="button-link">Volver al chat</a>
          </div>
        </form>
      </section>
    </main>

    <script>
      const passwordInput = document.querySelector("#login-password");
      const passwordToggle = document.querySelector("[data-password-toggle]");

      if (passwordInput && passwordToggle) {
        passwordToggle.addEventListener("click", () => {
          const showing = passwordInput.type === "text";
          passwordInput.type = showing ? "password" : "text";
          passwordToggle.setAttribute("aria-pressed", showing ? "false" : "true");
          passwordToggle.setAttribute("aria-label", showing ? "Mostrar contraseña" : "Ocultar contraseña");
          passwordToggle.setAttribute("title", showing ? "Mostrar contraseña" : "Ocultar contraseña");
          passwordToggle.classList.toggle("is-active", !showing);
        });
      }
    </script>
  </body>
</html>
